name: Deploy to Hostinger VPS

# Triggers on every push to main branch
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "=== [1/6] Pulling latest code ==="
            cd /var/www/shantiveer
            git pull origin main

            echo "=== [2/6] Activating virtualenv ==="
            source venv/bin/activate

            echo "=== [3/6] Installing/updating dependencies ==="
            pip install -r requirements.txt --quiet
            # mysqlclient is excluded from requirements.txt (not buildable on Vercel)
            # Install it explicitly here where MySQL system libs are available
            pip install mysqlclient>=2.2.0 --quiet

            echo "=== [4/6] Collecting static files ==="
            python manage.py collectstatic --noinput --clear

            echo "=== [5/6] Running database migrations ==="
            python manage.py migrate --noinput

            echo "=== [6/6] Restarting Gunicorn ==="
            sudo systemctl restart shantiveer

            echo "=== Deploy complete ==="
