{% load static %}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ultrasound Bills</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive_overrides.css' %}">
  <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  {% include 'includes/sidebar_dashboard.html' %}
  <main class="dash-main">
    <h2 class="mb-3">Ultrasound Bills</h2>

    <form class="mb-3" method="get">
      <input class="form-control" name="q" placeholder="Search by Bill No / Patient" value="{{ q|default:'' }}" />
    </form>

    <div class="card">
      <div class="card-body">
        <table class="table table-striped">
          <thead>
            <tr>
              <th>Bill No</th>
              <th>Patient</th>
              <th>Options</th>
              <th>Amount</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {% for r in reports %}
              <tr>
                <td>{{ r.bill_no }}</td>
                <td>{{ r.patient }}</td>
                <td>{{ r.tests }}</td>
                <td>{{ r.amount }}</td>
                <td>{{ r.date }}</td>
                <td>
                  <a class="btn btn-sm btn-outline-primary" href="{% url 'ultrasound:ultrasound_view_report' r.id %}">View</a>
                </td>
              </tr>
            {% empty %}
              <tr><td colspan="6" class="text-center">No ultrasound bills found.</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
  <script>
  /* ── Mobile sidebar toggle (standalone pages) ── */
  (function(){
    var btn     = document.getElementById('sidebarToggleBtn');
    var sidebar = document.getElementById('dashSidebar');
    if(!btn || !sidebar) return;
    var overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    overlay.id = 'sidebarOverlay';
    document.body.appendChild(overlay);
    function openSidebar(){ sidebar.classList.add('open'); overlay.classList.add('active'); btn.setAttribute('aria-expanded','true'); btn.querySelector('i').className='bi bi-x-lg'; document.body.style.overflow='hidden'; }
    function closeSidebar(){ sidebar.classList.remove('open'); overlay.classList.remove('active'); btn.setAttribute('aria-expanded','false'); btn.querySelector('i').className='bi bi-list'; document.body.style.overflow=''; }
    btn.addEventListener('click', function(){ sidebar.classList.contains('open') ? closeSidebar() : openSidebar(); });
    overlay.addEventListener('click', closeSidebar);
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSidebar(); });
    sidebar.querySelectorAll('a[href]').forEach(function(a){ a.addEventListener('click', function(){ if(window.innerWidth<=992) closeSidebar(); }); });
  })();
  </script>
</body>
</html>
