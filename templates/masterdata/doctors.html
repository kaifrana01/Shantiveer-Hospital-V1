{% extends 'base_cyan.html' %}
{% block title %}Add Doctor{% endblock %}
{% block page_title %}Add Doctor{% endblock %}
{% block content %}
<div class="d-flex gap-3 p-3 flex-wrap">
    <div class="master-sidebar" style="width:150px;min-width:120px">
        <a href="{% url 'masterdata:doctors' %}" class="active">add-doctor</a>
        <a href="{% url 'masterdata:doctor_list' %}">list-doctor</a>
    </div>
    <div class="flex-grow-1 form-card">
        <h2>Add Doctor</h2>
        <form method="post" id="addDoctorForm">{% csrf_token %}
            <div class="row g-2">
                <div class="col-md-6"><label class="small">Doctor Name <span class="text-danger">*</span></label><input name="name" class="form-control" required></div>
                <div class="col-md-3"><label class="small">Department</label><input name="department" class="form-control"></div>
                <div class="col-md-3"><label class="small">Specialization</label><input name="specialization" class="form-control"></div>
                
                <div class="col-md-3"><label class="small">Phone</label><input name="phone" class="form-control"></div>
                <div class="col-md-3"><label class="small">Email</label><input type="email" name="email" class="form-control"></div>
                <div class="col-md-2"><label class="small">Gender</label>
                    <select name="gender" class="form-select">
                        <option value="">-</option>
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                    </select>
                </div>
                <div class="col-md-2"><label class="small">Date of Birth</label><input type="date" name="dob" class="form-control"></div>
                <div class="col-md-2"><label class="small">Date of Joining</label><input type="date" name="date_of_joining" class="form-control"></div>
                
                <div class="col-md-4"><label class="small">Qualification</label><input name="qualification" class="form-control"></div>
                <div class="col-md-3"><label class="small">Registration Number</label><input name="registration_number" class="form-control"></div>
                <div class="col-md-2"><label class="small">Experience (Years)</label><input type="number" name="experience_years" class="form-control" min="0"></div>
                
                <div class="col-12"><label class="small">Address</label><textarea name="address" class="form-control" rows="2"></textarea></div>
            </div>
            <button type="submit" class="btn btn-primary mt-3" id="addDoctorBtn">Add Doctor</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
/* Anti-double-submit handled globally by no_double_submit.js */
</script>
{% endblock %}
