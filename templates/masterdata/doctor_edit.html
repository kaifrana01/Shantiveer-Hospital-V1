{% extends 'base_cyan.html' %}
{% block title %}Edit Doctor{% endblock %}
{% block page_title %}Edit Doctor{% endblock %}
{% block content %}
<div class="d-flex gap-3 p-3 flex-wrap">
  <div class="master-sidebar" style="width:150px;min-width:120px">
    <a href="{% url 'masterdata:doctors' %}">add-doctor</a>
    <a href="{% url 'masterdata:doctor_list' %}" class="active">list-doctor</a>
  </div>
  <div class="flex-grow-1" style="max-width:100%">
    <div class="form-card">
      <div class="section-title" style="background:#999;color:#fff;margin:-1.5rem -1.5rem 1rem;padding:0.5rem 1rem">
        Edit Doctor
      </div>
      {% if messages %}
        {% for msg in messages %}
          <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} py-2">{{ msg }}</div>
        {% endfor %}
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ doctor.name }}" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Department</label>
            <input type="text" name="department" class="form-control" value="{{ doctor.department }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Specialization</label>
            <input type="text" name="specialization" class="form-control" value="{{ doctor.specialization }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ doctor.phone }}">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" value="{{ doctor.email }}">
          </div>
          <div class="col-12 d-flex gap-2 mt-1">
            <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i>Save</button>
            <a href="{% url 'masterdata:doctor_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
