# =============================================================================
# Nginx config for shantiveerhospital.in
# Location on server: /etc/nginx/sites-available/shantiveer
# Enable with: sudo ln -s /etc/nginx/sites-available/shantiveer /etc/nginx/sites-enabled/
# =============================================================================

# Redirect plain HTTP → HTTPS
server {
    listen 80;
    server_name shantiveerhospital.in www.shantiveerhospital.in;

    # Let's Encrypt ACME challenge (needed for initial cert + renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl;
    server_name shantiveerhospital.in www.shantiveerhospital.in;

    # ── SSL (managed by Certbot / Let's Encrypt) ──────────────────────────
    ssl_certificate     /etc/letsencrypt/live/shantiveerhospital.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shantiveerhospital.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff                                        always;
    add_header X-Frame-Options           DENY                                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # ── Static files (served directly by Nginx, bypasses Django/Gunicorn) ─
    location /static/ {
        alias /var/www/shantiveer/staticfiles_collected/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files ───────────────────────────────────────────────────────
    location /media/ {
        alias /var/www/shantiveer/media/;
        expires 7d;
    }

    # ── Proxy everything else to Gunicorn ─────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20M;
    }
}
